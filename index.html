<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideCraft AI - Générateur de Présentations</title>
    
    <!-- Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF.js pour lire les PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- Mammoth.js pour lire les DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    
    <!-- PptxGenJS pour créer le PowerPoint -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <script>
        // Configuration du worker PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="max-w-3xl mx-auto p-8 mt-10 bg-white rounded-xl shadow-lg border border-gray-100">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">✨ SlideCraft AI</h1>
        <p class="text-center text-gray-500 mb-8">Transformez vos documents PDF/Word en PowerPoint en 1 clic !</p>

        <!-- Fichier -->
        <div class="mb-6 bg-blue-50 p-5 rounded-lg border border-blue-100">
            <h2 class="font-semibold text-gray-800 mb-2">📄 Document (PDF ou Word)</h2>
            <input type="file" id="fileInput" accept=".pdf,.docx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
        </div>

        <!-- Bouton -->
        <button id="generateBtn" onclick="processDocument()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md">
            🚀 Générer la présentation
        </button>

        <!-- Statut -->
        <div id="statusArea" class="mt-6 hidden">
            <div id="statusText" class="text-center font-medium text-gray-600 bg-gray-100 p-3 rounded"></div>
        </div>
    </div>

    <script>
        async function processDocument() {
            const fileInput = document.getElementById('fileInput');
            const statusArea = document.getElementById('statusArea');
            const statusText = document.getElementById('statusText');
            const btn = document.getElementById('generateBtn');

            if (fileInput.files.length === 0) {
                alert("Veuillez sélectionner un fichier PDF ou DOCX.");
                return;
            }

            const file = fileInput.files[0];
            statusArea.classList.remove('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // 1. Extraction du texte
                updateStatus("📄 Extraction du texte en cours...");
                const text = await extractTextFromFile(file);

                // 2. Appel à notre serveur (qui contactera l'IA secrètement)
                updateStatus("🧠 L'IA analyse le texte et crée les diapositives (cela peut prendre 10 à 20s)...");
                const slidesData = await generateSlidesWithAI(text);

                // 3. Création du PPTX
                updateStatus("📊 Création du fichier PowerPoint...");
                await createPPTX(slidesData, file.name);

                updateStatus("✅ Terminé ! Le téléchargement a démarré.");
            } catch (error) {
                console.error(error);
                statusText.innerHTML = `<span class="text-red-600">❌ Erreur : ${error.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function updateStatus(message) {
            document.getElementById('statusText').innerText = message;
        }

        async function extractTextFromFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            const arrayBuffer = await file.arrayBuffer();

            if (ext === 'docx') {
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                return result.value;
            } else if (ext === 'pdf') {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += pageText + "\n";
                }
                return fullText;
            } else {
                throw new Error("Format non supporté. Utilisez PDF ou DOCX.");
            }
        }

        async function generateSlidesWithAI(text) {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || "Erreur lors de la communication avec le serveur");
            }

            // Le serveur Node.js (via le SDK Google) nous renvoie directement les slides en JSON !
            return await response.json();
        }

        async function createPPTX(slidesData, originalFileName) {
            let pptx = new PptxGenJS();
            
            // Slide Titre
            let slideTitle = pptx.addSlide();
            slideTitle.addText(slidesData.presentation_title || "Présentation", {
                x: 1, y: 2, w: 8, h: 1.5,
                fontSize: 44, bold: true, color: "363636", align: "center"
            });
            slideTitle.addText("Généré par IA", {
                x: 1, y: 3.5, w: 8, h: 1,
                fontSize: 24, color: "888888", align: "center"
            });

            // Slides de contenu
            if (slidesData.slides && Array.isArray(slidesData.slides)) {
                slidesData.slides.forEach(slideInfo => {
                    let slide = pptx.addSlide();
                    
                    slide.addText(slideInfo.title || "Diapositive", {
                        x: 0.5, y: 0.5, w: 9, h: 1,
                        fontSize: 32, bold: true, color: "003366"
                    });
                    
                    if (slideInfo.bullet_points && Array.isArray(slideInfo.bullet_points)) {
                        let bulletItems = slideInfo.bullet_points.map(point => ({
                            text: point,
                            options: { bullet: true, fontSize: 18, color: "333333", breakLine: true }
                        }));
                        
                        slide.addText(bulletItems, {
                            x: 0.5, y: 1.8, w: 9, h: 3.5,
                            valign: "top"
                        });
                    }
                });
            }

            const outName = "Presentation_" + originalFileName.split('.')[0] + ".pptx";
            await pptx.writeFile({ fileName: outName });
        }
    </script>
</body>
</html>
