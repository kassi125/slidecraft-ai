<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideCraft AI - Générateur de Présentations</title>
    
    <!-- Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF.js pour lire les PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- Mammoth.js pour lire les DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    
    <!-- PptxGenJS pour créer le PowerPoint -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <script>
        // Configuration du worker PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="max-w-3xl mx-auto p-8 mt-10 bg-white rounded-xl shadow-lg border border-gray-100">
        <h1 class="text-4xl font-bold text-center text-blue-600 mb-2">✨ SlideCraft AI</h1>
        <p class="text-center text-gray-500 mb-8">Transformez vos documents PDF/Word en PowerPoint en 1 clic !</p>

        <!-- Thème IA -->
        <div class="mb-6 bg-gray-50 p-5 rounded-lg border border-gray-200">
            <h2 class="font-semibold text-gray-800 mb-2">🧠 Instructions pour l'IA (Optionnel)</h2>
            <input type="text" id="themeInput" placeholder="Ex: Professionnel, axé sur les chiffres, vulgarisation pour enfants..." class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            <p class="text-xs text-gray-500 mt-1">Précisez le ton ou les éléments à mettre en avant dans le contenu.</p>
        </div>

        <!-- Design du PowerPoint -->
        <div class="mb-6 bg-purple-50 p-5 rounded-lg border border-purple-200">
            <h2 class="font-semibold text-purple-800 mb-4">🎨 Apparence du PowerPoint</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Thèmes prédéfinis</label>
                    <select id="presetTheme" onchange="applyPreset()" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-400">
                        <option value="custom">-- Personnalisé --</option>
                        <option value="pro" selected>👔 Professionnel (Bleu/Blanc)</option>
                        <option value="dark">🌙 Mode Sombre (Blanc/Noir)</option>
                        <option value="creative">🎨 Créatif (Orange/Crème)</option>
                        <option value="minimal">🌿 Minimaliste (Gris/Blanc)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Police d'écriture</label>
                    <select id="fontSelect" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-400">
                        <option value="Arial">Arial</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Trebuchet MS">Trebuchet MS</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Impact">Impact</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Couleur des Titres</label>
                    <input type="color" id="titleColor" value="#003366" class="w-full h-10 p-0 border-0 rounded cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Couleur de Fond</label>
                    <input type="color" id="bgColor" value="#FFFFFF" class="w-full h-10 p-0 border-0 rounded cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Couleur du Texte (Puces)</label>
                    <input type="color" id="textColor" value="#333333" class="w-full h-10 p-0 border-0 rounded cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Fichier -->
        <div class="mb-6 bg-blue-50 p-5 rounded-lg border border-blue-100">
            <h2 class="font-semibold text-gray-800 mb-2">📄 Document (PDF ou Word)</h2>
            <input type="file" id="fileInput" accept=".pdf,.docx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
        </div>

        <!-- Bouton -->
        <button id="generateBtn" onclick="processDocument()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md text-lg">
            🚀 Générer la présentation
        </button>

        <!-- Statut -->
        <div id="statusArea" class="mt-6 hidden">
            <div id="statusText" class="text-center font-medium text-gray-600 bg-gray-100 p-3 rounded"></div>
        </div>
    </div>

    <script>
        // Appliquer les réglages d'un thème prédéfini
        function applyPreset() {
            const preset = document.getElementById('presetTheme').value;
            const titleColor = document.getElementById('titleColor');
            const bgColor = document.getElementById('bgColor');
            const textColor = document.getElementById('textColor');
            const fontSelect = document.getElementById('fontSelect');

            if (preset === 'pro') {
                titleColor.value = "#003366"; bgColor.value = "#FFFFFF"; textColor.value = "#333333"; fontSelect.value = "Arial";
            } else if (preset === 'dark') {
                titleColor.value = "#FFFFFF"; bgColor.value = "#1F2937"; textColor.value = "#E5E7EB"; fontSelect.value = "Helvetica";
            } else if (preset === 'creative') {
                titleColor.value = "#D97706"; bgColor.value = "#FEF3C7"; textColor.value = "#4B5563"; fontSelect.value = "Trebuchet MS";
            } else if (preset === 'minimal') {
                titleColor.value = "#374151"; bgColor.value = "#F9FAFB"; textColor.value = "#6B7280"; fontSelect.value = "Helvetica";
            }
        }

        // Appliquer le thème "Pro" par défaut au chargement
        document.addEventListener('DOMContentLoaded', applyPreset);

        async function processDocument() {
            const fileInput = document.getElementById('fileInput');
            const themeInput = document.getElementById('themeInput');
            const statusArea = document.getElementById('statusArea');
            const statusText = document.getElementById('statusText');
            const btn = document.getElementById('generateBtn');

            if (fileInput.files.length === 0) {
                alert("Veuillez sélectionner un fichier PDF ou DOCX.");
                return;
            }

            const file = fileInput.files[0];
            const theme = themeInput ? themeInput.value.trim() : "";
            
            // Récupérer les options de design choisies
            const designOptions = {
                titleColor: document.getElementById('titleColor').value.replace('#', ''),
                bgColor: document.getElementById('bgColor').value.replace('#', ''),
                textColor: document.getElementById('textColor').value.replace('#', ''),
                fontFace: document.getElementById('fontSelect').value
            };

            statusArea.classList.remove('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // 1. Extraction du texte
                updateStatus("📄 Extraction du texte en cours...");
                const text = await extractTextFromFile(file);

                // 2. Appel à notre serveur
                updateStatus("🧠 L'IA analyse le texte et crée les diapositives (cela peut prendre 10 à 20s)...");
                const slidesData = await generateSlidesWithAI(text, theme);

                // 3. Création du PPTX avec le design
                updateStatus("🎨 Construction visuelle du PowerPoint...");
                await createPPTX(slidesData, file.name, designOptions);

                updateStatus("✅ Terminé ! Le téléchargement a démarré.");
            } catch (error) {
                console.error(error);
                statusText.innerHTML = `<span class="text-red-600">❌ Erreur : ${error.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function updateStatus(message) {
            document.getElementById('statusText').innerText = message;
        }

        async function extractTextFromFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            const arrayBuffer = await file.arrayBuffer();

            if (ext === 'docx') {
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                return result.value;
            } else if (ext === 'pdf') {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += pageText + "\n";
                }
                return fullText;
            } else {
                throw new Error("Format non supporté. Utilisez PDF ou DOCX.");
            }
        }

        async function generateSlidesWithAI(text, theme) {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, theme: theme })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || "Erreur lors de la communication avec le serveur");
            }

            return await response.json();
        }

        async function createPPTX(slidesData, originalFileName, design) {
            let pptx = new PptxGenJS();
            
            // Appliquer le style global
            pptx.layout = 'LAYOUT_16x9';

            // Slide Titre
            let slideTitle = pptx.addSlide();
            slideTitle.background = { color: design.bgColor };
            slideTitle.addText(slidesData.presentation_title || "Présentation", {
                x: 1, y: 2, w: 8, h: 2,
                fontSize: 44, bold: true, color: design.titleColor, align: "center", fontFace: design.fontFace
            });

            // Slides de contenu
            if (slidesData.slides && Array.isArray(slidesData.slides)) {
                slidesData.slides.forEach(slideInfo => {
                    let slide = pptx.addSlide();
                    slide.background = { color: design.bgColor };
                    
                    // Titre de la slide
                    slide.addText(slideInfo.title || "Diapositive", {
                        x: 0.5, y: 0.5, w: 9, h: 1,
                        fontSize: 32, bold: true, color: design.titleColor, fontFace: design.fontFace
                    });
                    
                    // Puces
                    if (slideInfo.bullet_points && Array.isArray(slideInfo.bullet_points)) {
                        let bulletItems = slideInfo.bullet_points.map(point => ({
                            text: point,
                            options: { bullet: true, fontSize: 18, color: design.textColor, breakLine: true, fontFace: design.fontFace }
                        }));
                        
                        slide.addText(bulletItems, {
                            x: 0.5, y: 1.8, w: 9, h: 3.5,
                            valign: "top"
                        });
                    }
                });
            }

            const outName = "Presentation_" + originalFileName.split('.')[0] + ".pptx";
            await pptx.writeFile({ fileName: outName });
        }
    </script>
</body>
</html>
