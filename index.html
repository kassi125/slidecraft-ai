<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideCraft AI - Générateur de Présentations</title>
    
    <!-- Tailwind CSS pour le style -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuration Tailwind personnalisée pour des couleurs plus pros -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>

    <!-- PDF.js pour lire les PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- Mammoth.js pour lire les DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    
    <!-- PptxGenJS pour créer le PowerPoint -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen selection:bg-brand-100 selection:text-brand-900 py-12">

    <div class="max-w-3xl mx-auto p-8 sm:p-10 bg-white rounded-2xl shadow-soft border border-slate-100">
        
        <!-- En-tête -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-brand-50 text-brand-600 mb-4 shadow-sm border border-brand-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
                </svg>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-brand-600 to-indigo-600 mb-3">
                SlideCraft AI
            </h1>
            <p class="text-slate-500 text-lg">Transformez vos documents en présentations PowerPoint professionnelles en un clic.</p>
        </div>

        <div class="space-y-8">
            <!-- Instructions IA -->
            <div class="group">
                <div class="flex items-center mb-3">
                    <span class="text-xl mr-2">🧠</span>
                    <h2 class="text-lg font-semibold text-slate-800">Intelligence Artificielle</h2>
                </div>
                <div class="p-6 bg-slate-50 rounded-xl border border-slate-200 transition-colors group-hover:border-brand-300">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Thème ou ligne directrice (Optionnel)</label>
                    <input type="text" id="themeInput" placeholder="Ex : Ton formel, focus sur la finance, public cible : enfants..." class="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all placeholder-slate-400">
                </div>
            </div>

            <!-- Design -->
            <div class="group">
                <div class="flex items-center mb-3">
                    <span class="text-xl mr-2">🎨</span>
                    <h2 class="text-lg font-semibold text-slate-800">Apparence de la présentation</h2>
                </div>
                <div class="p-6 bg-slate-50 rounded-xl border border-slate-200 transition-colors group-hover:border-brand-300">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Thème prédéfini</label>
                            <select id="presetTheme" onchange="applyPreset()" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                                <option id="savedThemeOption" value="saved" class="hidden">⭐ Mon Thème Sauvegardé</option>
                                <option value="custom">-- Personnalisé --</option>
                                <option value="pro" selected>👔 Corporate (Bleu/Blanc)</option>
                                <option value="dark">🌙 Mode Sombre (Gris foncé)</option>
                                <option value="creative">🎨 Créatif (Chaud/Crème)</option>
                                <option value="minimal">🌿 Épuré (Gris clair/Blanc)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Typographie</label>
                            <select id="fontSelect" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                                <option value="Arial">Arial (Standard)</option>
                                <option value="Helvetica">Helvetica (Moderne)</option>
                                <option value="Times New Roman">Times New Roman (Classique)</option>
                                <option value="Trebuchet MS">Trebuchet MS (Dynamique)</option>
                                <option value="Georgia">Georgia (Élégant)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Couleur des Titres</label>
                            <input type="color" id="titleColor" value="#003366" class="w-full h-12 p-1 bg-white border border-slate-300 rounded-lg cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Couleur de Fond</label>
                            <input type="color" id="bgColor" value="#FFFFFF" class="w-full h-12 p-1 bg-white border border-slate-300 rounded-lg cursor-pointer">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-slate-700 mb-2">Couleur du Texte (Contenu)</label>
                            <input type="color" id="textColor" value="#333333" class="w-full h-12 p-1 bg-white border border-slate-300 rounded-lg cursor-pointer">
                        </div>
                    </div>
                    <div class="mt-4 flex justify-end">
                        <button onclick="saveTheme()" class="text-sm text-brand-600 hover:text-brand-800 font-medium flex items-center transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                            </svg>
                            Mémoriser mon thème personnalisé
                        </button>
                    </div>
                </div>
            </div>

            <!-- Fichier -->
            <div class="group">
                <div class="flex items-center mb-3">
                    <span class="text-xl mr-2">📄</span>
                    <h2 class="text-lg font-semibold text-slate-800">Source de données</h2>
                </div>
                <div class="p-6 bg-brand-50 rounded-xl border border-brand-100 transition-colors group-hover:border-brand-300">
                    <label class="block text-sm font-medium text-brand-900 mb-2">Document PDF ou Word (.docx)</label>
                    <input type="file" id="fileInput" accept=".pdf,.docx" class="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-brand-600 file:text-white hover:file:bg-brand-700 file:transition-colors file:cursor-pointer cursor-pointer bg-white border border-brand-200 rounded-lg">
                </div>
            </div>

            <!-- Bouton -->
            <button id="generateBtn" onclick="processDocument()" class="w-full mt-4 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-200 transform hover:-translate-y-0.5 flex justify-center items-center gap-3 text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Générer la présentation
            </button>

            <!-- Statut -->
            <div id="statusArea" class="mt-6 hidden transition-all duration-300">
                <div class="flex items-center justify-center p-4 bg-slate-50 border border-slate-200 rounded-xl">
                    <div id="spinner" class="animate-spin rounded-full h-5 w-5 border-b-2 border-brand-600 mr-3 hidden"></div>
                    <span id="statusText" class="font-medium text-slate-700"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sauvegarder le thème personnalisé via l'URL (Sans LocalStorage)
        function saveTheme() {
            const titleColor = document.getElementById('titleColor').value.replace('#', '');
            const bgColor = document.getElementById('bgColor').value.replace('#', '');
            const textColor = document.getElementById('textColor').value.replace('#', '');
            const fontSelect = document.getElementById('fontSelect').value;
            
            // Créer une URL avec les paramètres
            const params = new URLSearchParams();
            params.set('t', titleColor);
            params.set('b', bgColor);
            params.set('x', textColor);
            params.set('f', fontSelect);
            
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?' + params.toString();
            
            // Mettre à jour l'URL sans recharger la page
            window.history.pushState({path:newUrl}, '', newUrl);
            
            const savedOption = document.getElementById('savedThemeOption');
            savedOption.innerText = "🔗 Mon Thème (Lien Partagé)";
            savedOption.classList.remove('hidden');
            document.getElementById('presetTheme').value = 'saved';
            
            alert("✅ L'URL de la page a été mise à jour avec vos couleurs !\n\nMettez simplement cette page dans vos Favoris (Marque-pages) ou copiez le lien pour retrouver ce thème exact la prochaine fois !");
        }

        // Appliquer les réglages d'un thème prédéfini
        function applyPreset() {
            const preset = document.getElementById('presetTheme').value;
            const titleColor = document.getElementById('titleColor');
            const bgColor = document.getElementById('bgColor');
            const textColor = document.getElementById('textColor');
            const fontSelect = document.getElementById('fontSelect');

            if (preset === 'pro') {
                titleColor.value = "#003366"; bgColor.value = "#FFFFFF"; textColor.value = "#333333"; fontSelect.value = "Arial";
            } else if (preset === 'dark') {
                titleColor.value = "#FFFFFF"; bgColor.value = "#1E293B"; textColor.value = "#F8FAFC"; fontSelect.value = "Helvetica";
            } else if (preset === 'creative') {
                titleColor.value = "#EA580C"; bgColor.value = "#FFFBEB"; textColor.value = "#334155"; fontSelect.value = "Trebuchet MS";
            } else if (preset === 'minimal') {
                titleColor.value = "#334155"; bgColor.value = "#F8FAFC"; textColor.value = "#64748B"; fontSelect.value = "Helvetica";
            } else if (preset === 'saved') {
                // Si on re-sélectionne le thème de l'URL manuellement
                const params = new URLSearchParams(window.location.search);
                if (params.has('t')) {
                    titleColor.value = '#' + params.get('t');
                    bgColor.value = '#' + params.get('b');
                    textColor.value = '#' + params.get('x');
                    fontSelect.value = params.get('f');
                }
            }
        }

        // Charger le thème depuis l'URL au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('t') && params.has('b') && params.has('x') && params.has('f')) {
                // Remplir les champs avec l'URL
                document.getElementById('titleColor').value = '#' + params.get('t');
                document.getElementById('bgColor').value = '#' + params.get('b');
                document.getElementById('textColor').value = '#' + params.get('x');
                document.getElementById('fontSelect').value = params.get('f');
                
                // Afficher l'option personnalisée
                const savedOption = document.getElementById('savedThemeOption');
                savedOption.innerText = "🔗 Mon Thème (Lien Partagé)";
                savedOption.classList.remove('hidden');
                document.getElementById('presetTheme').value = 'saved';
            } else {
                applyPreset(); // Thème Pro par défaut
            }
        });

        async function processDocument() {
            const fileInput = document.getElementById('fileInput');
            const themeInput = document.getElementById('themeInput');
            const statusArea = document.getElementById('statusArea');
            const spinner = document.getElementById('spinner');
            const btn = document.getElementById('generateBtn');

            if (fileInput.files.length === 0) {
                alert("Veuillez sélectionner un document PDF ou Word.");
                return;
            }

            const file = fileInput.files[0];
            const theme = themeInput ? themeInput.value.trim() : "";
            
            // Récupérer les options de design
            const designOptions = {
                titleColor: document.getElementById('titleColor').value.replace('#', ''),
                bgColor: document.getElementById('bgColor').value.replace('#', ''),
                textColor: document.getElementById('textColor').value.replace('#', ''),
                fontFace: document.getElementById('fontSelect').value
            };

            statusArea.classList.remove('hidden');
            spinner.classList.remove('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed', 'transform-none', 'hover:shadow-lg');

            try {
                updateStatus("Extraction du texte du document...");
                const text = await extractTextFromFile(file);

                updateStatus("Analyse IA en cours (10 à 20 secondes)...");
                const slidesData = await generateSlidesWithAI(text, theme);

                updateStatus("Création visuelle du PowerPoint...");
                await createPPTX(slidesData, file.name, designOptions);

                spinner.classList.add('hidden');
                updateStatus("✅ Terminé ! Le PowerPoint a été téléchargé.");
            } catch (error) {
                console.error(error);
                spinner.classList.add('hidden');
                document.getElementById('statusText').innerHTML = `<span class="text-red-600">❌ Erreur : ${error.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed', 'transform-none');
            }
        }

        function updateStatus(message) {
            document.getElementById('statusText').innerText = message;
        }

        async function extractTextFromFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            const arrayBuffer = await file.arrayBuffer();

            if (ext === 'docx') {
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                return result.value;
            } else if (ext === 'pdf') {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += pageText + "\n";
                }
                return fullText;
            } else {
                throw new Error("Format non supporté. Veuillez utiliser un PDF ou un fichier Word (.docx).");
            }
        }

        async function generateSlidesWithAI(text, theme) {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, theme: theme })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || "Le serveur IA est indisponible.");
            }

            return await response.json();
        }

        async function createPPTX(slidesData, originalFileName, design) {
            let pptx = new PptxGenJS();
            
            // Appliquer le style global
            pptx.layout = 'LAYOUT_16x9';

            // Slide Titre
            let slideTitle = pptx.addSlide();
            slideTitle.background = { color: design.bgColor };
            slideTitle.addText(slidesData.presentation_title || "Présentation Stratégique", {
                x: 1, y: 2.2, w: 8, h: 2,
                fontSize: 48, bold: true, color: design.titleColor, align: "center", fontFace: design.fontFace
            });

            // Slides de contenu
            if (slidesData.slides && Array.isArray(slidesData.slides)) {
                slidesData.slides.forEach(slideInfo => {
                    let slide = pptx.addSlide();
                    slide.background = { color: design.bgColor };
                    
                    // Ligne de décoration (Style pro)
                    slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 0.5, w: 0.1, h: 0.6, fill: { color: design.titleColor } });
                    
                    // Titre de la slide
                    slide.addText(slideInfo.title || "Détails", {
                        x: 0.8, y: 0.45, w: 8.5, h: 0.8,
                        fontSize: 32, bold: true, color: design.titleColor, fontFace: design.fontFace
                    });
                    
                    // Ligne de séparation subtile
                    slide.addShape(pptx.ShapeType.line, { x: 0.5, y: 1.3, w: 9, h: 0, line: { color: design.textColor, width: 1, dashType: "solid" }, transparency: 80 });

                    // Puces
                    if (slideInfo.bullet_points && Array.isArray(slideInfo.bullet_points)) {
                        let bulletItems = slideInfo.bullet_points.map(point => ({
                            text: point,
                            options: { bullet: { type: 'number' }, fontSize: 20, color: design.textColor, breakLine: true, fontFace: design.fontFace }
                        }));
                        
                        slide.addText(bulletItems, {
                            x: 0.5, y: 1.6, w: 9, h: 4,
                            valign: "top",
                            lineSpacing: 35
                        });
                    }
                });
            }

            const outName = "Presentation_" + originalFileName.split('.')[0] + ".pptx";
            await pptx.writeFile({ fileName: outName });
        }
    </script>
</body>
</html>
